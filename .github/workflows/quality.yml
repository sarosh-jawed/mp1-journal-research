name: Quality checks

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ordinal measurement dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base-core r-cran-lavaan r-cran-semtools r-cran-jsonlite

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest -q
